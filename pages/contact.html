<body>

                <li><a href="contact.html">דברו איתנו</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">

            <!-- כותרת העמוד -->
            <div class="contact-header animated-element delay-1">
                <h1>דברו איתנו</h1>
                <div class="decorative-line"></div>
                <p>נשמח לשמוע מכם ולהפוך את האירוע הבא שלכם לבלתי נשכח.</p>
            </div>

            <!-- מעטפת הטופס והפרטים -->
            <div class="contact-container animated-card delay-2">

                <!-- טופס יצירת קשר -->
                <form class="contact-form" action="success.html" method="get">

                    <div class="form-group">
                        <label for="fullName">שם מלא</label>
                        <input type="text" id="fullName" name="fullName" placeholder="הכניסו את שמכם המלא" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">מספר טלפון</label>
                        <input type="tel" id="phone" name="phone" placeholder="050-0000000" required>
                    </div>

                    <div class="form-group">
                        <label for="email">דואר אלקטרוני</label>
                        <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                    </div>

                    <div class="form-group">
                        <label for="eventType">סוג האירוע</label>
                        <input type="text" id="eventType" name="eventType" placeholder="למשל: חתונה, בר מצווה, כנס יוקרתי">
                    </div>

                    <div class="form-group full-width">
                        <label for="message">הודעה / פרטים נוספים</label>
                        <textarea id="message" name="message" rows="5" placeholder="ספרו לנו מעט על החזון שלכם..." required></textarea>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="submit-btn">שליחת הודעה</button>
                    </div>

                </form>

            </div>
        </section>
    </main>

    <footer>
        <section>
            <h3>צרו איתנו קשר</h3>

                <p><span>טלפון:</span> 073-7323164</p>

                <p><span>כתובת:</span> בן גוריון 32, רמת גן</p>
            </div>
        </section>

        <section class="footer-bottom">
            <p><a href="about.html">אודות החברה</a> | © כל הזכויות שמורות</p>
        </section>
    </footer>

</body>

</html>
